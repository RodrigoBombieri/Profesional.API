name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore Profesional/tests/Profesional.UnitTests/Profesional.UnitTests.csproj

      - name: Compilar
        run: dotnet build Profesional/tests/Profesional.UnitTests/Profesional.UnitTests.csproj --no-restore -c Release

      - name: Correr tests
        run: dotnet test Profesional/tests/Profesional.UnitTests/Profesional.UnitTests.csproj --no-build -c Release --verbosity normal
